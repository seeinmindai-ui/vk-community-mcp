[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seeinmind-vk-mcp"
version = "0.1.0"
description = "Удалённый MCP для сообществ VK с изоляцией пользователей"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["mcp==1.30.0", "cryptography==50.0.0", "httpx==0.28.1", "uvicorn==0.54.0", "python-multipart==0.0.33"]

[project.scripts]
vk-community-mcp = "vk_mcp.server:main"
vk-community-admin = "vk_mcp.admin:main"

[tool.setuptools.packages.find]
include = ["vk_mcp*"]
